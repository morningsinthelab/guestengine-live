map $guest_source_slug $guest_canonical_url {
    default "";
    include /etc/nginx/guest-canonical.map;
}

map $guest_canonical_url $guest_canonical_header {
    default "<$guest_canonical_url>; rel=\"canonical\"";
    "" "";
}

map $guest_export_format $guest_export_suffix {
    default "";
    ".md" "/profile.md";
    ".json" "/data.json";
    "/transcript" "/transcript";
    "/transcript/" "/transcript";
    "/transcript/index.html" "/transcript";
}

# Forward only directory filters understood by mornings.network, never arbitrary query data.
map $arg_segment $guest_directory_segment {
    default "";
    "center-stage" "center-stage";
    "community-corner" "community-corner";
}
map "$arg_q|$arg_topic|$guest_directory_segment" $guest_directory_args {
    default "?q=$arg_q&topic=$arg_topic&segment=$guest_directory_segment";
    "||" "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/directory(?:/all)?(?:/index\.html|/?)$ {
        # Explicit empty fragment prevents an old URL fragment crossing domains.
        return 301 "https://mornings.network/shows/center-stage/guests$guest_directory_args#";
    }

    # Guest-owner tools stay on Guest Engine when the public directory moves.
    # Reuse the profile application and its existing server-side auth checks.
    location ~ ^/manage/profile/([a-zA-Z0-9_-]+)/?$ {
        set $guest_source_slug $1;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Link $guest_canonical_header always;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        sub_filter '__GUEST_CANONICAL_URL__' '$guest_canonical_url';
        sub_filter_once off;
        try_files /profile/index.html =404;
    }

    # Machine-readable public companions do not carry owner sessions.
    location ~ ^/profile/([a-zA-Z0-9_-]+)(\.md|\.json|/transcript/?|/transcript/index\.html)$ {
        set $guest_source_slug $1;
        set $guest_export_format $2;
        if ($guest_canonical_url != "") {
            return 301 "$guest_canonical_url$guest_export_suffix#";
        }
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Profile pages: /profile/{slug} → /profile/index.html
    # The JS reads the slug from the URL path
    location ~ ^/profile/([a-zA-Z0-9_-]+)/?$ {
        set $guest_source_slug $1;
        if ($guest_canonical_url != "") {
            rewrite ^ /guest-profile-bridge last;
        }
        try_files /profile/index.html =404;
    }

    # HTML needs a browser bridge: nginx cannot see #audit, JWT fragments, or saved sessions.
    location = /guest-profile-bridge {
        internal;
        add_header Link $guest_canonical_header always;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        sub_filter '__GUEST_CANONICAL_URL__' '$guest_canonical_url';
        sub_filter '__GUEST_OWNER_PATH__' '/manage/profile/$guest_source_slug';
        sub_filter_once off;
        try_files /profile/bridge.html =404;
    }

    # Digital Twin URLs are RETIRED. The Digital Twin is a *feature* of the
    # Authority Page (twin portrait, twin status, IP/consent layer) — not a
    # parallel URL. Permanent 301 to /profile/{slug} so any links already
    # in the wild keep working. Was: try_files /twin/index.html =404.
    location ~ ^/twin/([a-zA-Z0-9_-]+)/?$ {
        return 301 /profile/$1$is_args$args;
    }

    # Default: try the exact file, then directory, then 404
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Cache static assets (short cache for images, allow revalidation)
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
    }
}
